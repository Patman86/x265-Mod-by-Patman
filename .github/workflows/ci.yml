name: X265 CI

run-name: ${{ github.event.pull_request.title || github.event.head_commit.message || 'Manual run' }}

on:
  push:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# Grouping: PRs by PR number, so different PRs never block or cancel each other
# (a new commit on a PR still supersedes that PR's own in-flight run). Pushes to
# the default branch get one group PER COMMIT, so every commit is built in
# parallel and none is dropped while queued. Other branches group by ref, so WIP
# pushes supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref_name == github.event.repository.default_branch && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' || (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch) }}

# Least-privilege: jobs only need to read the repo
permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

defaults:
  run:
    shell: bash

# ─────────────────────────────────────────────────────────────────────────────
# Shared helper written inline in every test job's "Write step summary" step.
# Parses /tmp/summary.log (format: "  Label | encoded N frames in Xs (F fps), B kb/s, Avg QP:Q")
# and produces a Markdown table appended to GITHUB_STEP_SUMMARY.
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Phase 1 – Parallel (PR: Code Quality + Builds; Push: Builds only)
  # Code Quality (PR only) runs cppcheck + clang-format diff check scoped
  # to changed lines only. Builds produce CLI binaries and static libraries
  # for 8-bit, 10-bit, 12-bit, and multi-lib configurations.
  # ───────────────────────────────────────────────────────────────────────────

  code-quality:
    name: "Code Quality"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request_target'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cppcheck clang-format

      - name: Create clang-format config
        run: |
          printf '%s\n' \
            'BasedOnStyle: LLVM' \
            'IndentWidth: 4' \
            'UseTab: Never' \
            'ColumnLimit: 120' \
            'BreakBeforeBraces: Allman' \
            > .clang-format

      - name: Find changed files
        id: changed
        run: |
          ALL_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          if [ -z "$ALL_FILES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No files changed."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            echo "$ALL_FILES"
          fi

      - name: Run code quality checks
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          git diff origin/${{ github.base_ref }}...HEAD --unified=0 > /tmp/pr.patch
          python3 << 'PYEOF'
          import re, sys, subprocess, os, difflib
          from collections import Counter
          CPP_EXTENSIONS = ('.c', '.cpp', '.h', '.hpp')
          def show_trail(s):
              stripped = s.rstrip('\n')
              visible  = stripped.rstrip()
              trail    = stripped[len(visible):]
              return visible + trail.replace(' ', '·').replace('\t', '→')
          changed_lines = {}
          current_file  = None
          with open('/tmp/pr.patch') as f:
              for line in f:
                  m = re.match(r'\+\+\+ b/(.+)', line.rstrip())
                  if m:
                      current_file = m.group(1)
                      changed_lines.setdefault(current_file, set())
                      continue
                  m = re.match(r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@', line)
                  if m and current_file:
                      start = int(m.group(1))
                      count = int(m.group(2)) if m.group(2) is not None else 1
                      for i in range(start, start + max(count, 1)):
                          changed_lines[current_file].add(i)
          all_issues = []
          files = [f for f in changed_lines.keys() if f.endswith(CPP_EXTENSIONS)]
          if files:
              result = subprocess.run(
                  [
                      'cppcheck',
                      '--enable=warning,performance,portability,style',
                      '--suppress=missingIncludeSystem',
                      '--inline-suppr',
                      '--template={file}:{line}:{column}: {severity}: {message} [{id}]',
                      '--quiet',
                  ] + files,
                  capture_output=True, text=True
              )
              for line in result.stderr.splitlines():
                  m = re.match(r'^(.+?):(\d+):\d+: (\w+): (.+)', line)
                  if not m:
                      continue
                  issue_file = m.group(1).replace('\\', '/').lstrip('./')
                  issue_line = int(m.group(2))
                  severity   = m.group(3)
                  message    = m.group(4)
                  if severity == 'information':
                      continue
                  for changed_file, lines in changed_lines.items():
                      if (issue_file == changed_file or
                              issue_file.endswith('/' + changed_file) or
                              changed_file.endswith('/' + issue_file)):
                          if issue_line in lines:
                              all_issues.append({
                                  'file'   : changed_file,
                                  'line'   : issue_line,
                                  'type'   : severity,
                                  'message': message
                              })
                          break
          for changed_file, lines in changed_lines.items():
              if not changed_file.endswith(CPP_EXTENSIONS):
                  continue
              try:
                  original = open(changed_file, 'r', encoding='utf-8', newline='').readlines()
              except (FileNotFoundError, UnicodeDecodeError):
                  continue

              result = subprocess.run(
                  ['clang-format', '--style=file', changed_file],
                  capture_output=True, text=True
              )
              formatted = result.stdout.splitlines(keepends=True)
              matcher = difflib.SequenceMatcher(
                  None, original, formatted, autojunk=False)
              for tag, i1, i2, j1, j2 in matcher.get_opcodes():
                  if tag == 'equal':
                      continue
                  for k in range(i2 - i1):
                      orig_line = i1 + k + 1
                      if orig_line not in lines:
                          continue
                      orig = original[i1 + k]
                      if orig.endswith('\r\n'):
                          all_issues.append({
                              'file'   : changed_file,
                              'line'   : orig_line,
                              'type'   : 'style',
                              'message': (
                                  f"Windows CRLF line ending (\\r\\n)\n"
                                  f"         got:      |{orig.rstrip()} ← ends with \\r\\n\n"
                                  f"         expected: |{orig.rstrip()} ← should end with \\n only"
                              )
                          })
                          continue
                      if orig.endswith('\n') and orig[:-1].rstrip() != orig[:-1]:
                          all_issues.append({
                              'file'   : changed_file,
                              'line'   : orig_line,
                              'type'   : 'style',
                              'message': (
                                  f"trailing whitespace\n"
                                  f"         got:      |{show_trail(orig)}\n"
                                  f"         expected: |{orig[:-1].rstrip()}"
                              )
                          })
                          continue
                      if orig.startswith('\t'):
                          n_tabs   = len(orig) - len(orig.lstrip('\t'))
                          expected = '    ' * n_tabs + orig.lstrip('\t').rstrip()
                          all_issues.append({
                              'file'   : changed_file,
                              'line'   : orig_line,
                              'type'   : 'style',
                              'message': (
                                  f"tab used instead of spaces\n"
                                  f"         got:      |{'→' * n_tabs}{orig.lstrip(chr(9)).rstrip()}\n"
                                  f"         expected: |{expected}"
                              )
                          })

              # Missing newline at end of file
              if original and not original[-1].endswith('\n'):
                  last_line = len(original)
                  if last_line in lines:
                      all_issues.append({
                          'file'   : changed_file,
                          'line'   : last_line,
                          'type'   : 'style',
                          'message': (
                              f"missing newline at end of file\n"
                              f"         got:      |{original[-1].rstrip()} ⚠ no newline\n"
                              f"         expected: |{original[-1].rstrip()}↵"
                          )
                      })

          all_issues.sort(key=lambda x: (x['file'], x['line']))
          summary_path = os.environ.get('GITHUB_STEP_SUMMARY', '/tmp/summary.md')
          order = {'error': 0, 'warning': 1, 'style': 2}
          if all_issues:
              RED    = '\033[91m'
              YELLOW = '\033[93m'
              BLUE   = '\033[94m'
              BOLD   = '\033[1m'
              RESET  = '\033[0m'
              def color(issue_type):
                  if issue_type == 'error':     return RED
                  elif issue_type == 'warning': return YELLOW
                  else:                         return BLUE
              print(f"\n{BOLD}========================================{RESET}")
              print(f"{BOLD}         CODE QUALITY ISSUES{RESET}")
              print(f"{BOLD}========================================{RESET}\n")
              grouped = {}
              for issue in all_issues:
                  grouped.setdefault(issue['file'], []).append(issue)
              for file, file_issues in grouped.items():
                  file_issues = sorted(file_issues,
                                       key=lambda x: (order.get(x['type'], 9), x['line']))
                  print(f"{BOLD}  {file}{RESET}")
                  print(f"  {'─' * 40}")
                  for issue in file_issues:
                      c = color(issue['type'])
                      first_line, *rest = issue['message'].split('\n')
                      print(f"  {c}[{issue['type'].upper():^7}]{RESET}  "
                            f"Line {issue['line']:>4}  ->  {first_line}")
                      for extra in rest:
                          print(f"           {extra}")
                  print()
              counts = Counter(i['type'] for i in all_issues)
              print(f"{BOLD}  {'─' * 40}{RESET}")
              print(f"{BOLD}  SUMMARY{RESET}")
              print(f"  {'─' * 40}")
              print(f"  {RED}Errors   : {counts.get('error',   0):>3}{RESET}")
              print(f"  {YELLOW}Warnings : {counts.get('warning', 0):>3}{RESET}")
              print(f"  {BLUE}Style    : {counts.get('style',   0):>3}{RESET}")
              print(f"  {'─' * 40}")
              print(f"{BOLD}  Total    : {len(all_issues):>3} issue(s) found.{RESET}")
              print(f"  Fix and push again.")
              print(f"{BOLD}  {'─' * 40}{RESET}\n")
              BADGE = {
                  'error':   'display:inline-block;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:500;background:#ffd7d5;color:#a8200d;',
                  'warning': 'display:inline-block;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:500;background:#fff3cd;color:#7d4e00;',
                  'style':   'display:inline-block;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:500;background:#ddf4ff;color:#0550ae;',
              }
              TH  = 'style="background:#f6f8fa;color:#57606a;font-weight:500;text-align:left;padding:8px 12px;border:1px solid #d0d7de;font-size:12px;"'
              TD  = 'style="padding:7px 12px;border:1px solid #d0d7de;vertical-align:middle;font-size:13px;"'
              CODE= 'style="background:#f6f8fa;border:1px solid #d0d7de;border-radius:4px;padding:1px 6px;font-size:11px;font-family:monospace;color:#1f2328;"'
              with open(summary_path, 'w') as f:
                  f.write('<h2>&#9888;&#65039; Code Quality Issues</h2>\n')
                  for file, file_issues in grouped.items():
                      file_issues = sorted(file_issues,
                                           key=lambda x: (order.get(x['type'], 9), x['line']))
                      f.write(f'<h3 style="font-size:13px;font-weight:600;color:#0550ae;font-family:monospace;margin:1.5rem 0 8px;">&#128196; {file}</h3>\n')
                      f.write('<table style="border-collapse:collapse;width:100%;font-size:13px;table-layout:fixed;">\n')
                      f.write(f'<tr>'
                              f'<th {TH} width="55">Line</th>'
                              f'<th {TH} width="80">Type</th>'
                              f'<th {TH} width="300">Issue</th>'
                              f'<th {TH}>Got</th>'
                              f'<th {TH}>Expected</th>'
                              f'</tr>\n')
                      for issue in file_issues:
                          parts    = issue['message'].split('\n')
                          summary  = parts[0]
                          got      = ''
                          expected = ''
                          for p in parts[1:]:
                              if 'got:'      in p: got      = p.split('|', 1)[-1].strip()
                              if 'expected:' in p: expected = p.split('|', 1)[-1].strip()
                          t     = issue['type']
                          badge = f'<span style="{BADGE[t]}">{t.upper()}</span>'
                          if got and expected:
                              f.write(
                                  f'<tr>'
                                  f'<td {TD}><b>{issue["line"]}</b></td>'
                                  f'<td {TD}>{badge}</td>'
                                  f'<td {TD}>{summary}</td>'
                                  f'<td {TD}><code {CODE}>{got}</code></td>'
                                  f'<td {TD}><code {CODE}>{expected}</code></td>'
                                  f'</tr>\n'
                              )
                          else:
                              f.write(
                                  f'<tr>'
                                  f'<td {TD}><b>{issue["line"]}</b></td>'
                                  f'<td {TD}>{badge}</td>'
                                  f'<td {TD}>{summary}</td>'
                                  f'<td {TD}>&mdash;</td>'
                                  f'<td {TD}>&mdash;</td>'
                                  f'</tr>\n'
                              )
                      f.write('</table>\n')
                  e     = counts.get('error',   0)
                  w     = counts.get('warning', 0)
                  s     = counts.get('style',   0)
                  total = len(all_issues)
                  f.write('<h2>&#128202; Summary</h2>\n')
                  f.write('<table style="border-collapse:collapse;width:300px;font-size:13px;">\n')
                  f.write(f'<tr><th {TH}>Type</th><th {TH}>Count</th></tr>\n')
                  f.write(f'<tr><td {TD}><span style="{BADGE["error"]}">ERROR</span></td><td {TD}><b style="color:#a8200d;">{e}</b></td></tr>\n')
                  f.write(f'<tr><td {TD}><span style="{BADGE["warning"]}">WARNING</span></td><td {TD}><b style="color:#7d4e00;">{w}</b></td></tr>\n')
                  f.write(f'<tr><td {TD}><span style="{BADGE["style"]}">STYLE</span></td><td {TD}><b style="color:#0550ae;">{s}</b></td></tr>\n')
                  f.write(f'<tr><td {TD}><b>Total</b></td><td {TD}><b>{total}</b></td></tr>\n')
                  f.write('</table>\n')
                  f.write('<p style="font-size:13px;color:#57606a;margin-top:12px;">Fix the issues above and push again.</p>\n')
              sys.exit(1)
          else:
              print("\n[OK] No issues found on changed lines.\n")
              with open(summary_path, 'w') as f:
                  f.write('<h2>&#9989; Code Quality</h2>\n')
                  f.write('<p style="background:#dafbe1;border:1px solid #aceebb;border-radius:8px;'
                          'padding:16px 24px;display:inline-block;color:#116329;font-size:15px;">'
                          '&#127881; No issues found on changed lines.</p>\n')
          PYEOF

      - name: No changes detected
        if: steps.changed.outputs.has_changes == 'false'
        run: echo "[INFO] No files changed. Quality checks not applicable."

  # ─────────────────────────────────────────────────────────────────────────────
  # Phase 1 (cont'd) – Builds (parallel matrix per bit-depth + multilib, per platform)
  # Linux, macOS, AArch64 (cross-compiled) and Windows each build 8-bit, 10-bit,
  # 12-bit and multilib variants in parallel.
  # ─────────────────────────────────────────────────────────────────────────────

  build-linux:
    name: "Build Linux (${{ matrix.variant }}, ${{ matrix.config }})"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [8bit, 10bit, 12bit]
        config: [Release, Debug]
        # Multilib components — Release, run as extra parallel legs of this
        # same matrix. The final "linked" 8-bit binary is built by a separate
        # build-linux-multilib job that downloads these two component libs.
        include:
          - variant: multilib-12bit-component
            config: Release
          - variant: multilib-10bit-component
            config: Release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-linux-${{ matrix.variant }}-${{ matrix.config }}-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || 'master' }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            ${{ github.event.pull_request.number && format('ccache-linux-{0}-{1}-pr{2}-', matrix.variant, matrix.config, github.event.pull_request.number) || '' }}
            ccache-linux-${{ matrix.variant }}-${{ matrix.config }}-master-

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: /home/runner/apt-archives
          key: apt-build-linux-v2
          restore-keys: apt-build-linux-v2
      - name: Pre-populate apt cache
        run: sudo cp /home/runner/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake nasm ccache libnuma-dev

      - name: Prepare apt cache
        if: always()
        run: |
          mkdir -p /home/runner/apt-archives
          cp -n /var/cache/apt/archives/*.deb /home/runner/apt-archives/ 2>/dev/null || true

      # ── 8-bit ──────────────────────────────────────────────────────────────
      - name: Build 8-bit
        if: matrix.variant == '8bit'
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p build/8bit && cd build/8bit
          cmake ../../source \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=ON \
            -DENABLE_ASSEMBLY=ON \
            -DENABLE_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j$(nproc)
          test -f x265      && echo "8-bit CLI OK (${{ matrix.config }})"
          test -f libx265.a && echo "8-bit static lib OK"
          ./x265 --version
          echo "--- Unit tests ---"
          ./test/TestBench

      # ── 10-bit ─────────────────────────────────────────────────────────────
      - name: Build 10-bit
        if: matrix.variant == '10bit'
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p build/10bit && cd build/10bit
          cmake ../../source \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DHIGH_BIT_DEPTH=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=ON \
            -DENABLE_ASSEMBLY=ON \
            -DENABLE_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j$(nproc)
          test -f x265 && echo "10-bit CLI OK (${{ matrix.config }})"
          ./x265 --version
          ./test/TestBench

      # ── 12-bit ─────────────────────────────────────────────────────────────
      - name: Build 12-bit
        if: matrix.variant == '12bit'
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p build/12bit && cd build/12bit
          cmake ../../source \
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=ON \
            -DENABLE_ASSEMBLY=ON \
            -DENABLE_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j$(nproc)
          test -f x265 && echo "12-bit CLI OK (${{ matrix.config }})"
          ./x265 --version
          ./test/TestBench

      # ── multilib components (parallel legs of this same matrix) ────────────
      - name: Build multilib 12-bit component
        if: matrix.variant == 'multilib-12bit-component'
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p build/multilib/12bit && cd build/multilib/12bit
          cmake ../../../source \
            -DCMAKE_BUILD_TYPE=Release \
            -DHIGH_BIT_DEPTH=ON \
            -DMAIN12=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DEXPORT_C_API=OFF \
            -DENABLE_ASSEMBLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j$(nproc)

      - name: Build multilib 10-bit component
        if: matrix.variant == 'multilib-10bit-component'
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p build/multilib/10bit && cd build/multilib/10bit
          cmake ../../../source \
            -DCMAKE_BUILD_TYPE=Release \
            -DHIGH_BIT_DEPTH=ON \
            -DENABLE_SHARED=OFF \
            -DENABLE_CLI=OFF \
            -DEXPORT_C_API=OFF \
            -DENABLE_ASSEMBLY=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j$(nproc)

      - name: Upload 8-bit artifact
        if: matrix.variant == '8bit'
        uses: actions/upload-artifact@v7
        with:
          name: x265-linux-8bit${{ matrix.config == 'Debug' && '-debug' || '' }}
          path: build/8bit/x265
          retention-days: 3

      - name: Upload 8-bit library artifact
        if: matrix.variant == '8bit' && matrix.config == 'Release' && github.event_name != 'pull_request_target'
        uses: actions/upload-artifact@v7
        with:
          name: lib-linux-8bit
          path: build/8bit/libx265.a
          retention-days: 3

      - name: Upload 10-bit artifact
        if: matrix.variant == '10bit'
        uses: actions/upload-artifact@v7
        with:
          name: x265-linux-10bit${{ matrix.config == 'Debug' && '-debug' || '' }}
          path: build/10bit/x265
          retention-days: 3

      - name: Upload 12-bit artifact
        if: matrix.variant == '12bit'
        uses: actions/upload-artifact@v7
        with:
          name: x265-linux-12bit${{ matrix.config == 'Debug' && '-debug' || '' }}
          path: build/12bit/x265
          retention-days: 3

      - name: Upload multilib 12-bit component lib
        if: matrix.variant == 'multilib-12bit-component'
        uses: actions/upload-artifact@v7
        with:
          name: x265-linux-multilib-12bit-lib
          path: build/multilib/12bit/libx265.a
          retention-days: 3

      - name: Upload multilib 10-bit component lib
        if: matrix.variant == 'multilib-10bit-component'
        uses: actions/upload-artifact@v7
        with:
          name: x265-linux-multilib-10bit-lib
          path: build/multilib/10bit/libx265.a
          retention-days: 3

  build-linux-multilib:
    name: "Build Linux (multilib, linked)"
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: build-linux
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-linux-multilib-8bit-linked-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || 'master' }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            ${{ github.event.pull_request.number && format('ccache-linux-multilib-8bit-linked-pr{0}-', github.event.pull_request.number) || '' }}
            ccache-linux-multilib-8bit-linked-master-

      - name: Cache apt packages
        uses: actions/cache@v5
        with:
          path: /home/runner/apt-archives
          key: apt-build-linux-v2
          restore-keys: apt-build-linux-v2
      - name: Pre-populate apt cache
        run: sudo cp /home/runner/apt-archives/*.deb /var/cache/apt/archives/ 2>/dev/null || true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential cmake nasm ccache libnuma-dev

      - name: Prepare apt cache
        if: always()
        run: |
          mkdir -p /home/runner/apt-archives
          cp -n /var/cache/apt/archives/*.deb /home/runner/apt-archives/ 2>/dev/null || true

      - name: Download 12-bit component lib
        uses: actions/download-artifact@v8
        with:
          name: x265-linux-multilib-12bit-lib
          path: build/multilib/12bit

      - name: Download 10-bit component lib
        uses: actions/download-artifact@v8
        with:
          name: x265-linux-multilib-10bit-lib
          path: build/multilib/10bit

      - name: Build multilib 8-bit (linked)
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p build/multilib/8bit && cd build/multilib/8bit
          ln -sf ../../multilib/10bit/libx265.a libx265_main10.a
          ln -sf ../../multilib/12bit/libx265.a libx265_main12.a
