            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_SHARED=ON \
            -DENABLE_CLI=ON \
            -DENABLE_ASSEMBLY=ON \
            -DEXTRA_LIB="x265_main10.a;x265_main12.a" \
            -DEXTRA_LINK_FLAGS="-L." \
            -DLINKED_10BIT=ON \
            -DLINKED_12BIT=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          make -j$(nproc)
          test -f x265 && echo "Multilib CLI OK"
